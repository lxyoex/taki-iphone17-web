<script>
const ids=['lock','passcode','home','phone','phone-keypad','phone-outgoing','phone-failed','messages','chat','instagram','line-home','line-chat','other','photos'];let nextAfterUnlock='home',digits='',lastPhoneScreen='phone';
function fitDevice(){const scale=Math.min((window.innerWidth-16)/402,(window.innerHeight-16)/874);document.documentElement.style.setProperty('--device-scale',String(Math.max(0.1,scale)));}
fitDevice();window.addEventListener('resize',fitDevice);window.addEventListener('orientationchange',fitDevice);
function show(id){document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active');});const s=document.getElementById(id);if(s)s.classList.add('active');if(id==='chat')requestAnimationFrame(()=>{const a=document.getElementById('chatArea');if(a)a.scrollTop=a.scrollHeight;});}
function passDots(){document.querySelectorAll('.pass-dots i').forEach((e,i)=>e.classList.toggle('on',i<digits.length))}
function unlock(){if(digits==='0207'){show(nextAfterUnlock);digits='';passDots();document.getElementById('passError').textContent='';}else if(digits.length===4){document.getElementById('passError').textContent='암호가 올바르지 않습니다';setTimeout(()=>{digits='';passDots();document.getElementById('passError').textContent=''},650)}}
document.getElementById('lockTap').addEventListener('click',()=>{nextAfterUnlock='home';show('passcode')});
document.querySelectorAll('.notif').forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();if(!n.dataset.next)return;nextAfterUnlock=n.dataset.next;show('passcode')}));
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.key==='back'){digits=digits.slice(0,-1)}else if(digits.length<4){digits+=b.dataset.key}passDots();unlock()}));
document.getElementById('passCancel').addEventListener('click',()=>{if(digits.length){digits=digits.slice(0,-1);passDots();document.getElementById('passError').textContent=''}else{nextAfterUnlock='home';show('lock')}});
function setDockClean(app){
 const map={phone:'phoneDockIcon',line:'lineDockIcon',messages:'messageDockIcon',photos:'photosDockIcon'};
 const ids=app?[map[app]]:Object.values(map);
 ids.filter(Boolean).forEach(id=>{const img=document.getElementById(id);if(img)img.src=img.dataset.clean;});
}
function leaveApp(app){setDockClean(app);show('home');}
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{
 const active=document.querySelector('.screen.active');
 const app=active?.id;
 if(app==='phone-outgoing'||app==='phone-failed'||app==='phone-keypad'){callRunId++;clearCallAudio();leaveApp('phone');return;}
 if(app==='phone'||app==='line'||app==='line-home'||app==='line-chat'||app==='messages'||app==='photos')leaveApp(app==='line-home'||app==='line-chat'?'line':app);else show('home');
}));
document.getElementById('homeIndicator').addEventListener('click',()=>{
 const active=document.querySelector('.screen.active');const app=active?.id;
 if(app==='phone-outgoing'||app==='phone-failed'||app==='phone-keypad'){callRunId++;clearCallAudio();leaveApp('phone');return;}
 if(app==='phone'||app==='line'||app==='line-home'||app==='line-chat'||app==='messages'||app==='photos')leaveApp(app==='line-home'||app==='line-chat'?'line':app);else show('home');
});
// Phone screens are full-screen images (Call Screen_last / Call Screen_key_pad) with a layered, clickable bottom bar.
// Phone-only call simulation: no real phone call is ever placed.
const configuredVirtualNumber='010-2004-0207';let phoneDigits='',callTimer=null,ringContext=null,ringOscillators=[],callRunId=0;
const phoneNumberValue=document.getElementById('phoneNumberValue');
function formatPhone(raw){if(raw.indexOf('-')>=0)return raw;const d=raw;return d.length>7?d.replace(/^(\d{3})(\d{4})(\d{0,4})$/,(m,a,b,c)=>c?a+'-'+b+'-'+c:a+'-'+b):(d.length>3?d.replace(/^(\d{3})(\d+)$/,'$1-$2'):d);}
function renderPhoneDigits(){const t=formatPhone(phoneDigits);phoneNumberValue.textContent=t;phoneNumberValue.style.fontSize=(t.length<=13?36:Math.max(18,Math.floor(36*13/t.length)))+'px';}
function clearCallAudio(){if(callTimer){clearTimeout(callTimer);callTimer=null;}try{if('speechSynthesis' in window)window.speechSynthesis.cancel();}catch(e){}ringOscillators.forEach(o=>{try{o.stop();}catch(e){}});ringOscillators=[];if(ringContext){try{ringContext.close();}catch(e){}ringContext=null;}}
function playRingback(){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;ringContext=new Ctx();const ctx=ringContext;const start=()=>{if(ctx.state==='suspended')ctx.resume();let t=ctx.currentTime;for(let k=0;k<4;k++){const begin=t+k*1.75;for(const freq of [440,480]){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0.0001,begin);gain.gain.exponentialRampToValueAtTime(0.09,begin+0.04);gain.gain.setValueAtTime(0.09,begin+1.05);gain.gain.exponentialRampToValueAtTime(0.0001,begin+1.12);osc.connect(gain);gain.connect(ctx.destination);osc.start(begin);osc.stop(begin+1.14);ringOscillators.push(osc);}}};start();}catch(e){}}
function stopCallToKeypad(){callRunId++;clearCallAudio();renderPhoneDigits();show('phone-keypad');}
function beginVirtualCall(){
 const entered=phoneDigits.replace(/[^0-9*#]/g,'');
 if(entered!==configuredVirtualNumber.replace(/[^0-9*#]/g,'')) return;
 callRunId++; const run=callRunId; clearCallAudio(); show('phone-outgoing'); playRingback();
 callTimer=setTimeout(()=>{
  if(run!==callRunId)return;
  if(callTimer){clearTimeout(callTimer);callTimer=null;}
  // Switch to the supplied failure image exactly when the spoken prompt begins.
  show('phone-failed');
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance==='undefined'){
   callTimer=setTimeout(()=>{if(run===callRunId)stopCallToKeypad();},3000); return;
  }
  const utter=new SpeechSynthesisUtterance('상대방이 전화를 받지 않습니다.'); utter.lang='ko-KR'; utter.rate=0.95;
  let finished=false;
  const finish=()=>{if(finished||run!==callRunId)return;finished=true;if(callTimer){clearTimeout(callTimer);callTimer=null;}stopCallToKeypad();};
  utter.onend=finish; utter.onerror=finish;
  // Fallback for mobile browsers where speech events sometimes do not fire.
  callTimer=setTimeout(finish,5000);
  try{window.speechSynthesis.speak(utter);}catch(e){finish();}
 },7000);
}

document.querySelectorAll('.phoneCallsTab').forEach(b=>b.addEventListener('click',()=>{callRunId++;clearCallAudio();lastPhoneScreen='phone';show('phone');}));
document.querySelectorAll('.phoneKeypadTab').forEach(b=>b.addEventListener('click',()=>{callRunId++;clearCallAudio();lastPhoneScreen='phone-keypad';show('phone-keypad');}));
function flashKey(b){b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),140);}
function pressPhoneKey(k){
 if(k==='-'){const shown=formatPhone(phoneDigits);if(shown&&shown.slice(-1)!=='-'&&shown.length<16)phoneDigits=shown+'-';}
 else if(phoneDigits.length<16)phoneDigits+=k;
 renderPhoneDigits();
}
document.querySelectorAll('[data-phone-key]').forEach(b=>b.addEventListener('click',()=>{flashKey(b);pressPhoneKey(b.dataset.phoneKey);}));
document.querySelectorAll('[data-phone-action="back"]').forEach(b=>b.addEventListener('click',()=>{flashKey(b);phoneDigits=phoneDigits.slice(0,-1);renderPhoneDigits();}));
renderPhoneDigits();
document.getElementById('phoneStartCall').addEventListener('click',beginVirtualCall);
document.getElementById('phoneEndCall').addEventListener('click',stopCallToKeypad);
document.getElementById('phoneFailCancel').addEventListener('click',stopCallToKeypad);
document.getElementById('phoneFailRetry').addEventListener('click',()=>{if(callTimer){clearTimeout(callTimer);callTimer=null;}phoneDigits=configuredVirtualNumber;renderPhoneDigits();beginVirtualCall();});

// Restore the original compact message-list rows with side margins and natural spacing.
const messageRowAssets=['List Item_m1_1.png','List Item_m2.png','List Item_m3.png','List Item_m4.png','List Item_m5.png','List Item_m6.png','List Item_m7.png','List Item_m8.png'];
const messagesList=document.getElementById('messagesList');
messagesList.innerHTML=messageRowAssets.map((f,i)=>`<button class="list-item message-row" data-message="${i}" aria-label="메시지 ${i+1}"><img src="assets/${f}" alt="">${i===0?'<span class="msg-unread-dot" id="msgUnreadDot"></span>':''}</button>`).join('');
messagesList.addEventListener('click',e=>{if(e.target.closest('.message-row[data-message="0"]')){show('chat');requestAnimationFrame(()=>{const area=document.getElementById('chatArea');area.scrollTop=area.scrollHeight;});}});
new MutationObserver(()=>{if(document.getElementById('chat').classList.contains('active')){const d=document.getElementById('msgUnreadDot');if(d)d.remove();}}).observe(document.getElementById('chat'),{attributes:true,attributeFilter:['class']});
const chatItems=[
 {src:'Send Message.png',side:'out',time:null},
 {src:'Yuma Message 0.png',side:'in',time:null},
 {src:'Yuma Message.png',side:'in',time:null},
 {src:'Send Message2.png',side:'out',time:null},
 {src:'Send Message3.png',side:'out',time:'12:26'},
 {src:'Send Message4.png',side:'out',time:'18:48'},
 {src:'Send Message5.png',side:'out',time:'23:17'},
 {src:'Yuma Message2.png',side:'in',time:null}
];
const chatArea=document.getElementById('chatArea');chatArea.innerHTML=chatItems.map(m=>`${m.time?`<div class="chat-time">${m.time}</div>`:''}<div class="chat-msg ${m.side==='in'?'incoming':'outgoing'}"><img src="assets/${m.src}" alt=""></div>`).join('');
requestAnimationFrame(()=>{chatArea.scrollTop=chatArea.scrollHeight;});
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>{
 const a=b.dataset.app;
 // LINE opens its home screen; its dock badge clears after entry.
 if(a==='line'){
   show('line-home');
   setDockClean('line');
   document.getElementById('lineHomeScroll').scrollTop=0;
   return;
 }
 // Only phone, messages, and photos are clickable.
 if(['phone','messages','photos'].includes(a)){
   show(a);
   if(a==='phone'){setDockClean('phone');show('phone');return;}
   if(a==='photos'){
     const pic=document.getElementById('galleryPicture');
     if(pic && !pic.dataset.initialized){pic.style.top='0px';pic.dataset.initialized='1';pic.onload=()=>{const vp=document.getElementById('galleryViewport');vp.scrollTop=Math.max(0,pic.offsetHeight-vp.clientHeight);};if(pic.complete){const vp=document.getElementById('galleryViewport');vp.scrollTop=Math.max(0,pic.offsetHeight-vp.clientHeight);}}
   }
 } else return;
}));
document.getElementById('chatBack').addEventListener('click',()=>{
 const first=document.querySelector('#messagesList [data-message="0"] img');
 if(first) first.src='assets/List Item_m1.png';
 show('messages');
});

// 갤러리: 실제 세로 스크롤 영역. 손가락을 아래쪽(최근 사진)에서 위로 쓸어 올리면 사진이 위로 이동함.
const galleryViewport=document.getElementById('galleryViewport');
const galleryPicture=document.getElementById('galleryPicture');
galleryViewport.style.overflowY='auto';
galleryViewport.style.overflowX='hidden';
galleryViewport.style.scrollbarWidth='none';
galleryViewport.style.touchAction='pan-y';
galleryPicture.style.position='relative';
galleryPicture.style.top='0px';
galleryPicture.draggable=false;
galleryPicture.addEventListener('dragstart',e=>e.preventDefault());
galleryPicture.style.touchAction='pan-y';
// Keep the gallery viewport scrollable even when it receives touch input on iOS.
galleryViewport.addEventListener('touchmove',e=>{ if(e.touches.length===1) e.stopPropagation(); },{passive:true});
document.getElementById('gallerySearch').addEventListener('click',()=>{});
function sendChatMessage(){const inp=document.getElementById('chatInput');if(inp.value.trim()){let d=document.createElement('div');d.textContent=inp.value;d.style.cssText='margin:10px 8px 10px auto;padding:9px 13px;border-radius:18px;background:#0788ff;max-width:75%;font-size:12px;overflow-wrap:anywhere';document.getElementById('chatArea').appendChild(d);inp.value='';document.getElementById('chatArea').scrollTop=document.getElementById('chatArea').scrollHeight;}}document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChatMessage();}});

// ===== Memo app: list -> note pages (note pages are images; text the user adds is appended below the original text) =====
document.querySelector('[data-app="notes"]').addEventListener('click',()=>show('memo'));
document.querySelectorAll('[data-memo]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.memo;show('memo-'+k);document.getElementById('note-scroll-'+k).scrollTop=0;}));
document.querySelectorAll('[data-note-back]').forEach(b=>b.addEventListener('click',()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();show('memo');}));
document.querySelectorAll('[data-note-done]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('note-add-'+b.dataset.noteDone).blur();}));
function memoStore(k,v){try{if(v===undefined)return localStorage.getItem('memoAdded_'+k);localStorage.setItem('memoAdded_'+k,v);}catch(e){return null;}}
function noteAutosize(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}
document.querySelectorAll('.note-add').forEach(ta=>{
 const saved=memoStore(ta.dataset.note);if(saved)ta.value=saved;
 noteAutosize(ta);
 ta.addEventListener('input',()=>{noteAutosize(ta);memoStore(ta.dataset.note,ta.value);});
});
new MutationObserver(()=>{document.querySelectorAll('.screen.active .note-add').forEach(noteAutosize);}).observe(document.querySelector('.device'),{subtree:true,attributes:true,attributeFilter:['class']});
// ===== YouTube app: fixed top bar, scrolling video list, bottom bar visible only at the very top =====
const ytScroll=document.getElementById('ytScroll'),ytBottom=document.getElementById('ytBottom');
document.querySelector('[data-app="youtube"]').addEventListener('click',()=>{show('youtube');ytScroll.scrollTop=0;ytBottom.classList.remove('hide');});
ytScroll.addEventListener('scroll',()=>{ytBottom.classList.toggle('hide',ytScroll.scrollTop>2);},{passive:true});
